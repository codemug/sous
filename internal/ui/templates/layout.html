{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sous — {{.Title}}</title>
<style>
  :root{
    --ground:#f2f4f1; --surface:#fbfcfa; --surface-2:#e9ece7;
    --ink:#141c22; --ink-soft:#4e5a62; --ink-faint:#7c8890;
    --rule:#d2d7d0; --accent:#0e6257; --warn:#8f3618; --gold:#8a6714;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0e1418; --surface:#151d22; --surface-2:#1d262c;
      --ink:#e4eae6; --ink-soft:#9daab0; --ink-faint:#75838a;
      --rule:#28333a; --accent:#4fb9a6; --warn:#e07a54; --gold:#d2a63f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font-family:var(--mono);font-size:14px;line-height:1.55}
  header{border-bottom:1px solid var(--rule);padding:1rem 1.5rem;
         display:flex;gap:1.5rem;align-items:baseline;flex-wrap:wrap}
  header h1{font-size:1rem;margin:0;letter-spacing:.16em;text-transform:uppercase}
  header a{color:var(--ink-soft);text-decoration:none;font-size:.8rem;
           letter-spacing:.08em;text-transform:uppercase}
  header a:hover,header a:focus-visible{color:var(--accent)}
  main{padding:1.5rem;max-width:76rem}
  .pool{font-size:.78rem;color:var(--ink-faint);margin-left:auto}
  table{border-collapse:collapse;width:100%;font-size:.82rem}
  th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--rule);
        vertical-align:top;font-variant-numeric:tabular-nums}
  th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
     color:var(--ink-faint)}
  td.n{text-align:right}
  tbody tr:last-child td{border-bottom:none}
  .wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);
        border-radius:2px}
  .tag{display:inline-block;font-size:.64rem;letter-spacing:.09em;
       text-transform:uppercase;padding:.1rem .4rem;border-radius:2px;
       background:var(--surface-2)}
  .t-kind{color:var(--accent)}
  .t-arch{color:var(--ink-faint)}
  button{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;
         text-transform:uppercase;padding:.3rem .7rem;cursor:pointer;
         background:var(--surface-2);color:var(--ink);
         border:1px solid var(--rule);border-radius:2px}
  button:hover{border-color:var(--accent);color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .note{color:var(--ink-soft);font-size:.78rem;margin:0 0 1rem;max-width:62ch}
  .warn{color:var(--warn)}
  .sub{color:var(--ink-faint);font-size:.74rem}
</style>
</head>
<body>
<header>
  <h1>Sous</h1>
  <a href="/">Catalog</a>
  <a href="/deployments">Deployments</a>
  <a href="/larder">Larder</a>
  <a href="/sources">Sources</a>
  <span class="pool">pool {{printf "%.1f" .PoolGiB}} GiB · reserve {{printf "%.0f" .ReserveGiB}} GiB · {{.DeployCount}} deployed</span>
</header>
<main>
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}
