{{define "login"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sous — Sign in</title>
<style>
/* Standalone by design: this page cannot use the main layout, which expects a
 * pageData carrying the pool size and deployment counts. Someone who is not
 * signed in should not be told how much memory the node has or how many models
 * are running - a login page that leaks the thing it is guarding is not one. */
:root{
  --paper:oklch(98.5% 0.004 250); --paper-2:oklch(96.5% 0.005 250);
  --ink:oklch(24% 0.02 258); --ink-body:oklch(34% 0.018 257);
  --ink-mute:oklch(52% 0.014 255); --ink-faint:oklch(64% 0.012 255);
  --rule:oklch(89% 0.008 252); --rule-firm:oklch(80% 0.010 252);
  --accent:oklch(58% 0.20 256); --accent-ink:oklch(46% 0.18 256);
  --drift:oklch(62% 0.15 62); --drift-wash:oklch(96% 0.04 72);
  --font-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-sm:6px; --radius-md:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:oklch(16% 0.014 260); --paper-2:oklch(19.5% 0.015 260);
    --ink:oklch(94% 0.008 250); --ink-body:oklch(84% 0.010 252);
    --ink-mute:oklch(66% 0.012 254); --ink-faint:oklch(54% 0.012 255);
    --rule:oklch(29% 0.014 258); --rule-firm:oklch(38% 0.016 258);
    --accent:oklch(70% 0.17 256); --accent-ink:oklch(80% 0.14 256);
    --drift:oklch(76% 0.14 68); --drift-wash:oklch(28% 0.06 68);
  }
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{
  margin:0;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;
  background:var(--paper);color:var(--ink-body);
  font-family:var(--font-display);font-size:.9375rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.card{width:100%;max-width:23rem}
.mark{
  font-weight:600;font-size:1rem;letter-spacing:.02em;color:var(--ink);
  display:flex;align-items:center;gap:.45rem;margin-bottom:.35rem;
}
.mark::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
h1{font-size:1.5rem;font-weight:600;font-style:normal;letter-spacing:-.02em;
   color:var(--ink);margin:0 0 .3rem;text-wrap:balance}
.sub{color:var(--ink-mute);font-size:.8125rem;margin:0 0 1.5rem}
form{border:1px solid var(--rule);border-radius:var(--radius-md);
     background:var(--paper-2);padding:1.25rem}
label{display:block;font-family:var(--font-mono);font-size:.6875rem;
      letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
      margin-bottom:.3rem}
input{
  width:100%;font-family:var(--font-mono);font-size:.875rem;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule-firm);
  border-radius:var(--radius-sm);padding:.55rem .65rem;margin-bottom:1rem;
}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
button{
  width:100%;font-family:var(--font-mono);font-size:.75rem;letter-spacing:.06em;
  text-transform:uppercase;padding:.6rem;cursor:pointer;
  background:var(--accent);color:oklch(99% 0 0);border:1px solid var(--accent);
  border-radius:var(--radius-sm);transition:background 120ms cubic-bezier(.2,.8,.3,1);
}
button:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{
  border:1px solid var(--drift);background:var(--drift-wash);color:var(--ink);
  border-radius:var(--radius-sm);padding:.5rem .65rem;font-size:.8125rem;
  margin-bottom:1rem;
}
.foot{color:var(--ink-faint);font-size:.6875rem;font-family:var(--font-mono);
      margin-top:1rem;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<main class="card">
  <div class="mark">SOUS</div>
  <h1>Sign in</h1>
  <p class="sub">Model deployments on this node.</p>

  <form method="post" action="/login">
    {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">

    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>

    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">Sign in</button>
  </form>

  <p class="foot">Scripts use the API token instead — send it as
  <code>Authorization: Bearer …</code>, and no session is involved.</p>
</main>
</body>
</html>
{{end}}
