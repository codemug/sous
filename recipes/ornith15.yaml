id: ornith15
kind: vllm
modality: text
model: ornith-ai/Ornith-1.5-35B-A3B-FP8
image: vllm/vllm-openai@sha256:d5a8e53ad2534e24b99ba1a2e3f183a213adc0da48ed83166cb75534a5903a17
served_as:
    - ornith
declared:
    weights_gib: 36.66
    kv_gib: 26
args:
    enable-auto-tool-choice: true
    enable-prefix-caching: true
    gpu-memory-utilization: 0.48
    kv-cache-dtype: auto
    kv-cache-memory-bytes: 27917287424
    max-model-len: 262144
    max-num-batched-tokens: 8192
    max-num-seqs: 4
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
    tensor-parallel-size: 1
    tool-call-parser: qwen3_coder
env:
    CUTE_DSL_ARCH: sm_121a
    HF_HOME: /root/.cache/huggingface
    TORCH_CUDA_ARCH_LIST: 12.1a
    VLLM_LOGGING_LEVEL: INFO
notes: |-
    MEASURED 2026-08-19, same prompts and same hour as qwen36:

               prose   code   json    agg
      qwen36   64.78  66.24  69.07  66.55 tok/s
      ornith   39.12  46.12  49.53  44.89 tok/s   -33%

    It works: loads on the same pinned image, 36.85 GiB against the 36.66
    declared, and tool calls parse. It is a third slower than the model it
    would replace.

    SPECULATION IS NOT THE REASON, which was the first thing to suspect:
    mean acceptance length 1.81-2.19 here against qwen36's 1.63 accepted
    per draft, on the same k=2. Ornith's MTP is doing at least as well.

    KV IS NOT THE REASON EITHER, and this recipe used to claim otherwise.
    It predicted KV would be far cheaper per token than qwen36's 88.3 KiB
    because 30 of 40 layers are linear_attention. Measured: 308,736 tokens
    at the same 26 GiB pin - byte for byte identical to qwen36. Of course
    it is: same architecture, same 10 full-attention layers, same 2 KV
    heads. The prediction reasoned from the hybrid layout and forgot it was
    describing the incumbent too.

    WHAT IS LEFT is the quantization. Weights are 5.2% larger, which on a
    bandwidth-bound decode buys about 5% of the gap. The rest is most
    likely the scheme itself: compressed-tensors here uses DYNAMIC
    per-token activation quantization, so every forward pass computes
    activation scales at runtime that qwen36's static fp8 does not.
    Untested - it is a hypothesis with the right shape, not a measurement.

    THE TRADE, stated plainly: a third of the throughput for the vendor's
    claimed coding gains over this exact incumbent - Terminal-Bench 2.1
    67.8 vs 52.5, SWE-bench Verified 79 vs 73.4. Those are THEIR numbers.
    Nothing here verifies quality, and a throughput comparison cannot.
    Worth adopting only if agentic coding quality is what this slot is
    for; not worth it if the slot is general chat.

    Same slot as qwen36, not an addition: the planner refuses it beside
    qwen36 with must_free=[qwen36].

    tool-call-parser was READ from chat_template.jinja rather than assumed
    - the template emits '<tool_call>\n<function=NAME>', the qwen3_coder
    shape - and the tool call was exercised, not just configured.

    Multimodal weights are present (333 visual tensors) but modality stays
    text: nothing here sends it images, and claiming an untested capability
    is how a recipe starts lying.
