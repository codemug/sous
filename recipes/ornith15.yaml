id: ornith15
kind: vllm
modality: text
model: ornith-ai/Ornith-1.5-35B-A3B-FP8
image: vllm/vllm-openai@sha256:d5a8e53ad2534e24b99ba1a2e3f183a213adc0da48ed83166cb75534a5903a17
served_as:
    - ornith
declared:
    weights_gib: 36.66
    kv_gib: 26
args:
    enable-auto-tool-choice: true
    enable-prefix-caching: true
    gpu-memory-utilization: 0.48
    kv-cache-dtype: auto
    kv-cache-memory-bytes: 27917287424
    max-model-len: 262144
    max-num-batched-tokens: 8192
    max-num-seqs: 4
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":1}'
    tensor-parallel-size: 1
    tool-call-parser: qwen3_coder
env:
    CUTE_DSL_ARCH: sm_121a
    HF_HOME: /root/.cache/huggingface
    TORCH_CUDA_ARCH_LIST: 12.1a
    VLLM_LOGGING_LEVEL: INFO
    VLLM_TUNED_CONFIG_FOLDER: /root/.cache/huggingface/moe-configs
notes: |-
    MEASURED 2026-08-19/20 against qwen36, same prompts, same node.
    Streamed, so TTFT and decode are separated - an earlier pass used
    non-streaming and folded prefill into decode, which hid half of this.

                     ttft-short  ttft-16k   decode-code
      qwen36              121ms     395ms     68.19 t/s
      ornith k=1          130ms     435ms     55.28 t/s
      ornith k=2          135ms     419ms     48.07 t/s
      ornith no-spec       87ms     227ms     38.27 t/s

    TTFT IS NOT THE PROBLEM and needs no work: within 10% of qwen36 at
    both prompt lengths, and 16k tokens prefill in 435ms either way. The
    whole gap is decode.

    SPECULATION IS WORTH +44% (38.27 -> 55.28) and the shipped k=2 threw
    13% of it away. The MTP layer is EXCLUDED FROM QUANTIZATION by the
    checkpoint's own config - 785 bf16 tensors - so each extra draft token
    is a full bf16 MoE forward, and the second one does not earn it back.

    SPECULATION COSTS TTFT, which is the trade to know: 87 -> 130ms short
    and 227 -> 435ms at 16k, because the first decode step now drafts too.
    If this slot ever becomes latency-critical rather than throughput-
    critical, dropping speculation nearly halves time to first token.

    WHY IT IS STILL BEHIND qwen36 at k=1, from the boot logs: the two pick
    DIFFERENT linear kernels for the same architecture -
    CutlassFP8ScaledMMLinearKernel here against qwen36's
    CutlassFp8BlockScaledMMKernel - which follows from channel-wise plus
    dynamic per-token activations rather than block-scaled weights. That
    is a property of the checkpoint, not a setting.

    NOT the reason, ruled out by measurement: KV is identical (308,736
    tokens at the same pin, same 10 full-attention layers), CUDA graph
    capture is identical (FULL 3 / PIECEWISE 5), and the attention backend
    is FLASH_ATTN for both.

    OPEN, and it would help qwen36 too: both log 'Using default MoE
    config. Performance might be sub-optimal!' - 316 tuned MoE tables ship
    and none is for GB10, so a 256-expert MoE runs untuned Triton on both.
    benchmark_moe.py ships in the image. Untested.

    THE TRADE, unchanged: fewer tokens per second for the vendor's claimed
    coding gains over this exact incumbent - Terminal-Bench 2.1 67.8 vs
    52.5, SWE-bench Verified 79 vs 73.4. Their numbers; nothing here
    verifies quality and a throughput bench never could.

    Same slot as qwen36: the planner refuses it beside qwen36 with
    must_free=[qwen36].

    tool-call-parser was READ from chat_template.jinja and then exercised,
    not merely configured. Multimodal weights are present (333 visual
    tensors) but modality stays text: nothing here sends it images, and
    claiming an untested capability is how a recipe starts lying.
