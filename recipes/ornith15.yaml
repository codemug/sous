id: ornith15
kind: vllm
modality: text
model: ornith-ai/Ornith-1.5-35B-A3B-FP8
image: vllm/vllm-openai@sha256:d5a8e53ad2534e24b99ba1a2e3f183a213adc0da48ed83166cb75534a5903a17
served_as:
    - ornith
declared:
    weights_gib: 36.66
    kv_gib: 26
args:
    enable-auto-tool-choice: true
    enable-prefix-caching: true
    gpu-memory-utilization: 0.48
    kv-cache-dtype: auto
    kv-cache-memory-bytes: 27917287424
    max-model-len: 262144
    max-num-batched-tokens: 8192
    max-num-seqs: 4
    reasoning-parser: qwen3
    speculative-config: '{"method":"mtp","num_speculative_tokens":1}'
    tensor-parallel-size: 1
    tool-call-parser: qwen3_coder
env:
    CUTE_DSL_ARCH: sm_121a
    HF_HOME: /root/.cache/huggingface
    TORCH_CUDA_ARCH_LIST: 12.1a
    VLLM_LOGGING_LEVEL: INFO
    VLLM_TUNED_CONFIG_FOLDER: /root/.cache/huggingface/moe-configs
notes: |-
    MEASURED. Decode, against qwen36 on identical prompts:

               prose   code   long-ctx
      qwen36   67.89  68.40      54.94 tok/s
      ornith   48.27  56.27      39.47 tok/s   about -19%

    COLD PREFILL, novel prompts, warmup absorbed - qwen36 vs ornith:
        100 tok   189 / 191 ms    identical
      1,000 tok   308 / 307 ms    identical
      5,000 tok   850 / 1515 ms   1.8x
     18,000 tok  2658 / 3553 ms   1.3x  (6,772 vs 5,065 tok/s)

    So prefill is free at chat lengths and costs about a third more at
    long context, which is the same story as decode and points at the same
    cause: dynamic per-token activation quantization does work on every
    pass that qwen36's static fp8 does once.

    MEASURING THIS WAS HARDER THAN IT SHOULD HAVE BEEN, and the traps are
    worth more than the numbers:
      - enable-prefix-caching makes a REPEATED prompt return in 585ms what
        costs 2658ms cold at 18k. Benchmarking the same prompt twice
        measures the cache and calls it prefill.
      - the first request after a deploy pays one-time warmup; 35 SECONDS
        was observed once at 18k and is not prefill.
      An earlier conclusion that 'ornith prefills within 10% of qwen36'
      came from comparing one model's cached number with the other's cold
      one. scripts/bench/prefill-cold.py defeats both artifacts.

    num_speculative_tokens IS 1. MTP ships unquantized in this checkpoint
    (785 bf16 mtp.* tensors), so every extra draft is a full bf16 MoE
    forward. Speculation is worth +44% over none; k=2 gives 13% of that
    back and loses to k=1 on every case measured. Speculation also buys
    throughput WITH latency - turning it off nearly halves TTFT.

    THE GB10-TUNED MoE TABLE BUYS NOTHING. vLLM ships 316 tuned tables and
    none for this device, so a table was generated on this GPU and loaded
    via VLLM_TUNED_CONFIG_FOLDER - confirmed read in the log, not assumed.
    A/B, one script, back to back: 48.87/55.24/41.29 tuned against
    48.17/56.11/39.55 default. Wins two, loses one, all inside noise. The
    env var is kept because it is harmless and the table is now correct;
    the honest summary is that the default Triton config was already fine
    for these shapes.

    Same slot as qwen36 - the planner refuses it alongside, must_free=[qwen36].
    Vendor claims large agentic-coding gains over qwen3.6 (Terminal-Bench
    2.1 67.8 vs 52.5, SWE-bench Verified 79 vs 73.4). Unverified here, and
    no throughput test can verify it. The trade is ~19% of decode.
