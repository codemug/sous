id: kokoro
kind: container
modality: tts
image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
declared:
    weights_gib: 3
    kv_gib: 0
env:
    HF_HOME: /root/.cache/huggingface
notes: |-
    ON THE GPU since 2026-08-16, after measuring. Was CPU-only, and the
    argument for that was inherited rather than checked:

      CPU  1194 / 1131 / 1391 ms   GPU  202 / 201 / 193 / 198 / 194 ms

    ~6x faster for 3 GiB. TTS had been the largest single component of the
    voice loop - larger than ASR (~440 ms) and the LLM (~260 ms) combined.

    The old reasoning was 'keeping TTS off the GPU leaves the bandwidth for
    the LLM'. True when a 25.6 GiB Omni was co-resident; false here. Kokoro
    is 82M parameters reading ~0.16 GB per forward against qwen38's 24.87 GB
    - under 1% of this box's ~273 GB/s.

    arm64 confirmed in the manifest AND at runtime ('Model warmed up on
    cuda: kokoro_v1' on GB10). The second check is not optional: GPU whisper
    reported the GPU as visible, silently ran on CPU, and was slower.

    68 voices. Revert by pinning the -cpu tag; it still has an arm64 image.
