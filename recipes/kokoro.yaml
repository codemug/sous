id: kokoro
kind: container
modality: tts
image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
declared:
    weights_gib: 3
    kv_gib: 0
env:
    HF_HOME: /root/.cache/huggingface
notes: |-
    MOVED TO GPU 2026-08-16, AFTER MEASURING. This recipe previously
    specified the -cpu image with a 0 GiB footprint, and the reasoning for
    that was written when a 25.6 GiB Omni was co-resident. It does not
    survive the arithmetic at this model's size.

    Kokoro is 82M parameters and reads ~0.16 GB per forward pass against a
    27B model's 24.87 GB - under 1% of this box's ~273 GB/s. The
    'co-resident models split bandwidth negative-sum' argument is real for
    two large models and irrelevant for this one.

    Measured side by side on gx10, identical 14-word input:
      CPU   1194 / 1131 / 1391 ms
      GPU    202 /  201 /  193 / 198 / 194 ms      ~6x faster
      cost  3 GiB resident

    TTS was the largest single component of the voice loop - larger than ASR
    (~440 ms) and the LLM (~260 ms) combined. This takes the round trip from
    ~1.41s to roughly 0.5s, the difference between dictation and
    conversation.

    THE DECLARED FOOTPRINT IS LOAD-BEARING, NOT DOCUMENTATION: spec.go sets
    GPU: Declared.WeightsGiB > 0, so a 0 here does not merely misreport the
    capacity plan, it withholds the device and silently returns this service
    to the CPU path it was moved off.

    ARM64 was checked before the move, because this box has lost hours to it:
    the image publishes linux/arm64 AND confirmed at runtime, not just in the
    manifest - 'Found GPU0 NVIDIA GB10 ... cuda capability 12.1', 'CUDA: True'.
    GPU whisper was tried here and silently ran on CPU because CTranslate2
    ships no aarch64 CUDA build, and was SLOWER than the CPU image while
    reporting the GPU as visible.

    To go back: set the image to the -cpu tag AND set weights_gib to 0, or
    the container gets a GPU it does not use.
