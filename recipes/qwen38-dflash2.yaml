id: qwen38-dflash2
kind: vllm
modality: text
model: Inferact/Qwen3.8-27B-NVFP4
image: fleet/vllm-dflash2:pr52816-aarch64
served_as:
    - dflash2
declared:
    weights_gib: 28.45
    kv_gib: 34
args:
    enable-auto-tool-choice: true
    gpu-memory-utilization: 0.62
    kv-cache-dtype: fp8
    max-model-len: 262144
    reasoning-parser: qwen3
    speculative-config: '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
    tool-call-parser: qwen3_coder
env:
    CUTE_DSL_ARCH: sm_121a
    HF_HOME: /root/.cache/huggingface
    TORCH_CUDA_ARCH_LIST: 12.1a
    VLLM_LOGGING_LEVEL: INFO
notes: |-
    MEASURED 2026-08-26: NVFP4 target vs the FP8 target below,
    SAME harness both arms, same session:

                      FP8/28.77         NVFP4/24.87
      JSON list       37.74 t/s 6.04   45.25 t/s 6.20   +20%
      code + tests    38.40 t/s 6.16   43.33 t/s 5.98   +13%
      prose           15.52 t/s 2.91   19.77 t/s 2.72   +27%
      aggregate       30.55 t/s 5.04   36.12 t/s 4.97   +18%

    Second column is mean accepted length of 8 (7 drafted + 1
    verified). 1222 draft rounds sampled across the two arms.

    THIS IS THE TRADE THE ORIGINAL BUILD OF THIS RECIPE COULD NOT
    TAKE. NVFP4 was refused outright until 2026-08-26: DFlash2's
    candidate selector raised on any quantized target lm_head, and
    the fleet's build of vLLM PR 52816 was frozen at the PR's very
    first commit - a stale clone silently never picked up the 16
    commits landed since, including upstream commit 5fb106ba2
    ('DFlash2: let the target LM head be quantized', 2026-08-19),
    which deleted that exact guard. Rebuilding from the PR's
    current head fixed it; verified by grepping the installed
    package for the deleted guard's own error string before ever
    deploying this, then confirmed for real by this measurement.

    ACCEPTANCE HELD, 5.04 -> 4.97 aggregate - a smaller target
    checkpoint did not make the drafter's proposals worse, which is
    what the vendor's own PR commit measured too (RadixArk NVFP4 on
    B200: 4.71 mean acceptance, near-identical to its FP8 sibling).
    Every workload is faster, not just the aggregate - NVFP4's
    smaller weights mean fewer bytes read per forward pass on a box
    that is bandwidth-bound at decode, which is the same physics
    argument that ruled bf16 out below, now working the other way.

    NVFP4 IS NOW THE DEPLOYED TARGET. The FP8 measurement below is
    kept as the paired baseline for the table above, not as an
    active configuration.

    MEASURED 2026-08-22, fp8 KV vs 16-bit, SAME harness both arms
    (FP8 TARGET, since superseded by NVFP4 above - this finding is
    about KV dtype, which is orthogonal to target weight
    quantization and remains in effect under NVFP4 too):

                      16-bit/32768      fp8/262144
      JSON list       31.67 t/s 5.95   37.53 t/s 6.01   +18%
      code + tests    24.01 t/s 5.10   37.24 t/s 5.96   +55%
      prose           13.05 t/s 3.00   16.37 t/s 2.62   +25%
      aggregate       22.91 t/s 4.68   30.38 t/s 4.86   +33%

    Second column is mean accepted length of 8 (7 drafted + 1
    verified). 1631 draft rounds sampled across the two arms.

    EIGHT TIMES THE CONTEXT AND FASTER, which is not the trade the
    qwen38 recipe warned about. fp8 KV does move the attention
    backend and does force CUDA graphs off FULL_AND_PIECEWISE, and
    that was expected to cost something here - decode is bandwidth
    bound at ~273 GB/s, and halving KV bytes per token buys back
    more than the graph mode loses. Acceptance held: 4.68 -> 4.86
    aggregate.

    PROSE IS THE ONE REGRESSION and it is in acceptance, not speed:
    3.00 -> 2.62. Prose is where the drafter guesses worst, so it
    has the least speculation to lose and the most bandwidth to
    gain; it still ends up 25% faster.

    The 2026-08-19 figures below were taken with a DIFFERENT
    workload set and are not comparable with the table above. They
    are kept for the acceptance-spread finding, which still holds.

    MEASURED 2026-08-19: 27.42 tok/s aggregate against the 23.97
    NVFP4 + MTP baseline, +14.4%. The aggregate is the least useful
    number here, because the spread is the finding:

      42.96 tok/s  JSON list      +79%
      28.40 tok/s  code + tests   +18%
      19.16 tok/s  prose          -20%

    Mean acceptance length 4.45-6.10 of 7 drafted. Speculation pays
    where the drafter can guess - syntax it has seen a thousand times -
    and COSTS on prose, where every rejected draft is bandwidth spent
    for nothing on a box already bandwidth-bound at decode. A model
    serving mixed traffic gets the average; one serving structured
    output gets most of the 79%.

    DFlash2 speculative decoding, at the time against Qwen3.8-27B-FP8
    (the checkpoint the 2026-08-22 table above was run against; the
    deployed target is NVFP4 as of 2026-08-26, at the top).

    ITS IMAGE IS LOCALLY BUILT AND ON NO REGISTRY. vLLM PR 52816 adds
    DFlash2DraftModel, which no released vLLM and no SGLang carries. A
    node without that image cannot deploy this recipe.

    bf16 was never viable regardless of target quantization: decode
    here is bandwidth-bound near 273 GB/s, so bf16's 51.77 GiB against
    either quantized target roughly halves the base rate - and ~3x
    speculation on a halved base lands below the unspeculated NVFP4 +
    MTP baseline (23.97 tok/s). bf16 clears every software blocker and
    loses on physics regardless of which quantized format wins.

    Block-scaled FP8 DID work on sm_121 (historical, from when FP8 was
    the target): that build logged CutlassFp8BlockScaledMMKernel and
    auto-disabled DeepGemm on Blackwell, which is the path that
    crashed earlier attempts.
