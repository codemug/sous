id: whisper
kind: container
modality: asr
image: ghcr.io/speaches-ai/speaches:latest-cpu
declared:
    weights_gib: 0
    kv_gib: 0
env:
    HF_HOME: /home/ubuntu/.cache/huggingface
    WHISPER__MODEL: Systran/faster-whisper-tiny
    WHISPER__TTL: "-1"
notes: |-
    RETIRED, replaced by asr. Could not use the GPU here at all:
    faster-whisper is built on CTranslate2, which publishes no aarch64 CUDA
    build. The cuda image was tried and was SLOWER (4.54s vs 3.92s) because
    it silently ran on CPU anyway - nvidia-smi saw the GPU while
    ctranslate2.get_cuda_device_count() returned 0. No device flag fixes
    that; only a different runtime would.
archived: true
