name: build

# Sous deploys to asus-gx10, which is aarch64, while development happens on
# x86. Publishing a multi-arch image means the fleet's compose file names one
# tag and the right binary lands on whichever node pulls it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The fleet target is aarch64 and the CI runner is not, so a
      # cross-compile check here catches an arch-specific break before it
      # reaches a node rather than after.
      - name: Cross-compile for the deployment target
        run: GOOS=linux GOARCH=arm64 go build ./...

  image:
    needs: test
    # Pull requests get built and tested but not published: a fork should not
    # be able to push an image the fleet would then pull.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # WHAT A DEPLOYMENT SHOULD PIN: a semver tag (0.1.0). It is
          # immutable, it maps to a GitHub release you can read, and it makes
          # "what is running" answerable from the compose file alone.
          #
          # major.minor (0.1) exists for tracking patches without editing a
          # marker. sha tags are the escape hatch for bisecting a regression.
          # `latest` is convenience only and is deliberately NOT what a node
          # tracks - a moving tag turns "redeploy" into an unrepeatable event.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tag should produce something a human can read, not just a moving image.
  # Deployments pin a version; this is where you find out what that version
  # changed.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Notes from the commits since the previous tag, so the release says
          # what actually changed rather than repeating the tag name.
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          {
            echo "## Container image"
            echo
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}"
            echo '```'
            echo
            echo "linux/amd64 and linux/arm64."
            echo
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' $RANGE
          } > notes.md

          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
